name: aurachat
description: AURA Chat App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_database: ^11.3.0
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.0

  # State Management
  provider: ^6.1.2

  # UI & System
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  intl: ^0.19.0

  # Auth & Security
  local_auth: ^2.2.0
  local_auth_android: ^1.0.0
  local_auth_ios: ^1.0.0

  # Storage & Preferences
  shared_preferences: ^2.2.2

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Connectivity
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/emojis/
    - assets/audio/
