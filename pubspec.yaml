name: aurachat
description: AURA Chat App
publish_to: 'none'

version: 5.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_database: ^11.3.0
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.0
  cloudinary_public: ^0.23.1

  # State Management
  provider: ^6.1.2
  google_generative_ai: ^0.4.0

  # UI & System
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  intl: ^0.18.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  share_plus: ^10.0.0
  uni_links: ^0.5.1
  crypto: ^3.0.3
  app_links: ^6.1.0

  # Auth & Security
  local_auth: ^2.2.0
  local_auth_android: ^1.0.0
  local_auth_ios: ^1.0.0

  # Phone & Input
  intl_phone_field: ^3.2.0

  # http request
  http: ^1.2.0
 
  # Chat & Media
  uuid: ^4.5.0
  emoji_picker_flutter: ^3.1.0
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  open_filex: ^4.5.0
  just_audio: ^0.9.0
  record: ^4.4.4
  video_player: ^2.8.2
  dio: ^5.7.0
  path: ^1.8.3
  url_launcher: ^6.2.5

  # Calls
  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.3.0

  # Storage & Preferences
  shared_preferences: ^2.2.2

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Connectivity
  connectivity_plus: ^5.0.0

  # NEW: Audio player for ringtone preview
  # audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/emojis/
    - assets/audio/
    # NEW: Call ringtones
    - assets/audio/ringtone_ambition.mp3
    - assets/audio/ringtone_phonk.mp3
    - assets/audio/ringtone_fadded.mp3
    - assets/audio/ringtone_pop.mp3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21
