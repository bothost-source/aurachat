name: Build TARRIFIC CHAT

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create Android project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example
          ls -la android/app/
          cat android/app/build.gradle

      - name: Add Firebase plugin
        run: |
          if [ -f "android/app/build.gradle" ]; then
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
              sed -i 's/apply plugin: "com.android.application"/apply plugin: "com.android.application"\napply plugin: "com.google.gms.google-services"/' android/app/build.gradle
            fi
          else
            echo "ERROR: android/app/build.gradle not found!"
            exit 1
          fi

      - name: Add Firebase classpath
        run: |
          if [ -f "android/build.gradle" ]; then
            if ! grep -q "com.google.gms:google-services" android/build.gradle; then
              sed -i "/classpath 'com.android.tools.build:gradle'/a\\        classpath 'com.google.gms:google-services:4.3.15'" android/build.gradle
            fi
          fi

      - name: Fix minSdkVersion
        run: |
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle
          sed -i 's/minSdkVersion 19/minSdkVersion 23/g' android/app/build.gradle

      - name: Fix namespace and applicationId
        run: |
          sed -i 's/namespace = "com.bothost.aurachat"/namespace = "com.example.aurachat"/g' android/app/build.gradle
          sed -i 's/applicationId "com.bothost.aurachat"/applicationId "com.example.aurachat"/g' android/app/build.gradle
          sed -i 's/applicationId = "com.bothost.aurachat"/applicationId = "com.example.aurachat"/g' android/app/build.gradle

      - name: Setup MainActivity for biometric
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/aurachat
          cat > android/app/src/main/kotlin/com/example/aurachat/MainActivity.kt << 'EOF'
          package com.example.aurachat

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity: FlutterFragmentActivity() {
          }
          EOF

      - name: Create asset directories
        run: |
          mkdir -p assets/images
          mkdir -p assets/emojis
          mkdir -p assets/audio

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tarrific-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: v${{ github.run_number }}
          name: "TARRIFIC CHAT v${{ github.run_number }}"
          body: "TARRIFIC CHAT Release"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create Web project and Build
        run: |
          flutter config --enable-web
          if [ ! -d "web" ]; then
            flutter create . --platforms=web
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
